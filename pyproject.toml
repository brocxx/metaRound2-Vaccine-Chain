[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaccine-cold-chain"
version = "2.0.0"
description = "OpenEnv-compliant RL environment for vaccine cold chain management in rural India"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "OpenEnv Hackathon Team"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.20.0",
    "openai>=1.0.0",
    "openenv-core>=0.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/brocxx/Vaccine-Cold-Chain-OpenEnv"
Repository = "https://github.com/brocxx/Vaccine-Cold-Chain-OpenEnv"
"Bug Tracker" = "https://github.com/brocxx/Vaccine-Cold-Chain-OpenEnv/issues"

[project.scripts]
vaccine-cold-chain = "client:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "models"]